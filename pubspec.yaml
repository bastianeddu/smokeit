name: smokeit
description: >-
  Simuliert das Abbrennen von Zigarette, Zigarre, Joint oder Bong auf dem Display -
  gesteuert durch Sauggeraeusche, mit Crackle- und Flutsch-Sounds.
publish_to: "none"
version: 1.1.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  permission_handler: ^12.0.1
  noise_meter: ^6.0.0
  just_audio: ^0.10.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/audio/crackle.wav
    - assets/audio/inhale.wav
    - assets/audio/bong.wav
